name: barber-booking

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: barber_booking
      POSTGRES_PASSWORD: barber_booking
      POSTGRES_DB: barber_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U barber_booking -d barber_booking"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: